name: Register FreeRoute WireGuard device

on:
  workflow_dispatch:
    inputs:
      device_name:
        description: Device label (lowercase letters, digits and hyphens; e.g. poco-x4)
        required: true
        type: string
      client_public_key:
        description: Public key generated by FreeRoute on the device (never enter a private key)
        required: true
        type: string
      endpoint_ip:
        description: Public IPv4 or IPv6 address of the deployed FreeRoute server
        required: true
        type: string
      endpoint_port:
        description: Public UDP port forwarded to WireGuard on the server
        required: true
        default: "51820"
        type: string
      ssh_port:
        description: SSH port shown in the server provider panel
        required: true
        default: "22"
        type: string

permissions:
  contents: read

concurrency:
  group: freeroute-register-wireguard-device
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out FreeRoute
        uses: actions/checkout@v4

      - name: Validate public registration inputs
        env:
          DEVICE_NAME: ${{ inputs.device_name }}
          CLIENT_PUBLIC_KEY: ${{ inputs.client_public_key }}
          ENDPOINT_IP: ${{ inputs.endpoint_ip }}
          ENDPOINT_PORT: ${{ inputs.endpoint_port }}
          SSH_PORT: ${{ inputs.ssh_port }}
          VPN_HOST: ${{ secrets.VPN_HOST }}
          VPN_USER: ${{ secrets.VPN_USER }}
          VPN_SSH_KEY: ${{ secrets.VPN_SSH_KEY }}
          VPN_KNOWN_HOSTS: ${{ secrets.VPN_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPN_HOST" && -n "$VPN_USER" && -n "$VPN_SSH_KEY" && -n "$VPN_KNOWN_HOSTS" ]] || {
            echo "Configure the verified VPN_HOST, VPN_USER, VPN_SSH_KEY and VPN_KNOWN_HOSTS repository secrets first." >&2
            exit 1
          }
          python3 - "$DEVICE_NAME" "$CLIENT_PUBLIC_KEY" "$ENDPOINT_IP" "$ENDPOINT_PORT" "$SSH_PORT" <<'PY'
          import base64
          import ipaddress
          import re
          import sys

          name, public_key, endpoint_text, endpoint_port_text, ssh_port_text = sys.argv[1:]
          if not re.fullmatch(r"[a-z0-9](?:[a-z0-9-]{0,30}[a-z0-9])?", name):
              raise SystemExit("device_name must be 1-32 lowercase letters, digits or hyphens.")
          if name in {"windows", "android", "iphone"}:
              raise SystemExit("device_name is reserved for a legacy FreeRoute peer.")
          try:
              decoded = base64.b64decode(public_key, validate=True)
          except (ValueError, base64.binascii.Error):
              raise SystemExit("client_public_key must be a base64 WireGuard public key.")
          if len(public_key) != 44 or len(decoded) != 32 or not any(decoded) or base64.b64encode(decoded).decode("ascii") != public_key:
              raise SystemExit("client_public_key must encode a non-zero 32-byte WireGuard public key.")
          try:
              endpoint = ipaddress.ip_address(endpoint_text)
          except ValueError:
              raise SystemExit("endpoint_ip must be a public IPv4 or IPv6 address.")
          if not endpoint.is_global or endpoint.is_multicast or endpoint.is_reserved or endpoint.is_unspecified:
              raise SystemExit("endpoint_ip must be a globally routable public address.")
          for value, label in ((endpoint_port_text, "endpoint_port"), (ssh_port_text, "ssh_port")):
              if not re.fullmatch(r"[1-9][0-9]{0,4}", value) or not 1 <= int(value) <= 65535:
                  raise SystemExit(f"{label} must be a canonical integer from 1 to 65535.")
          PY

      - name: Confirm endpoint is outside Russia
        env:
          ENDPOINT_IP: ${{ inputs.endpoint_ip }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 15 --retry 1 \
            "https://ipwho.is/$ENDPOINT_IP?fields=success,ip,country,country_code" \
            --output "$RUNNER_TEMP/endpoint-geo.json"
          python3 - "$RUNNER_TEMP/endpoint-geo.json" "$ENDPOINT_IP" <<'PY'
          import ipaddress
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              result = json.load(handle)
          if result.get("success") is not True:
              raise SystemExit("Could not verify endpoint geolocation; refusing registration.")
          try:
              if ipaddress.ip_address(str(result.get("ip", ""))) != ipaddress.ip_address(sys.argv[2]):
                  raise SystemExit("Geolocation response does not match the endpoint IP.")
          except ValueError:
              raise SystemExit("Geolocation service returned an invalid IP.")
          country_code = str(result.get("country_code", "")).upper()
          if len(country_code) != 2:
              raise SystemExit("Geolocation service returned no valid country code.")
          if country_code == "RU":
              raise SystemExit("The selected FreeRoute endpoint geolocates to Russia.")
          print(f"Endpoint country estimate: {result.get('country')} ({country_code}).")
          PY

      - name: Prepare pinned SSH identity
        env:
          VPN_SSH_KEY: ${{ secrets.VPN_SSH_KEY }}
          VPN_KNOWN_HOSTS: ${{ secrets.VPN_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$VPN_SSH_KEY" > "$RUNNER_TEMP/vpn_key"
          chmod 600 "$RUNNER_TEMP/vpn_key"
          printf '%s\n' "$VPN_KNOWN_HOSTS" > "$RUNNER_TEMP/vpn_known_hosts"
          chmod 600 "$RUNNER_TEMP/vpn_known_hosts"
          grep -qve '^[[:space:]]*$' "$RUNNER_TEMP/vpn_known_hosts" || {
            echo "VPN_KNOWN_HOSTS must contain the server host key verified through the provider's trusted console." >&2
            exit 1
          }

      - name: Verify pinned SSH access
        env:
          VPN_HOST: ${{ secrets.VPN_HOST }}
          VPN_USER: ${{ secrets.VPN_USER }}
          SSH_PORT: ${{ inputs.ssh_port }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$VPN_USER" == "root" ]]; then
            remote_command="true"
          else
            remote_command="sudo -n true"
          fi
          ssh -p "$SSH_PORT" -i "$RUNNER_TEMP/vpn_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/vpn_known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o UpdateHostKeys=no \
            "$VPN_USER@$VPN_HOST" "$remote_command"

      - name: Register public key and print safe profile metadata
        env:
          VPN_HOST: ${{ secrets.VPN_HOST }}
          VPN_USER: ${{ secrets.VPN_USER }}
          DEVICE_NAME: ${{ inputs.device_name }}
          CLIENT_PUBLIC_KEY: ${{ inputs.client_public_key }}
          ENDPOINT_IP: ${{ inputs.endpoint_ip }}
          ENDPOINT_PORT: ${{ inputs.endpoint_port }}
          SSH_PORT: ${{ inputs.ssh_port }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$VPN_USER" == "root" ]]; then
            remote_command="env WG_DEVICE_NAME='$DEVICE_NAME' WG_CLIENT_PUBLIC_KEY='$CLIENT_PUBLIC_KEY' python3 -"
          else
            remote_command="sudo -n env WG_DEVICE_NAME='$DEVICE_NAME' WG_CLIENT_PUBLIC_KEY='$CLIENT_PUBLIC_KEY' python3 -"
          fi
          registration="$(ssh -p "$SSH_PORT" -i "$RUNNER_TEMP/vpn_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/vpn_known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o UpdateHostKeys=no \
            "$VPN_USER@$VPN_HOST" "$remote_command" < scripts/register_wireguard_peer.py)"
          python3 - "$registration" "$DEVICE_NAME" "$ENDPOINT_IP" "$ENDPOINT_PORT" <<'PY'
          import ipaddress
          import json
          import os
          import sys

          data = json.loads(sys.argv[1])
          endpoint = ipaddress.ip_address(sys.argv[3])
          endpoint_host = f"[{endpoint}]" if endpoint.version == 6 else str(endpoint)
          if data.get("device_name") != sys.argv[2]:
              raise SystemExit("Remote registration returned a different device label.")
          print("FreeRoute device registered successfully.")
          print(f"Device: {data['device_name']}")
          print(f"Client address: {data['ipv4']}")
          print(f"Client IPv6 address: {data['ipv6']}")
          print(f"Server endpoint: {endpoint_host}:{sys.argv[4]}")
          print(f"Server public key: {data['server_public_key']}")
          print("The client private key was not sent to the server or GitHub.")
          print("The profile can now be assembled locally on the device.")
          summary = [
              "## FreeRoute device registration",
              f"- Device: \`{data['device_name']}\`",
              f"- Client IPv4: \`{data['ipv4']}\`",
              f"- Client IPv6: \`{data['ipv6']}\`",
              f"- Endpoint: \`{endpoint_host}:{sys.argv[4]}\`",
              f"- Server public key: \`{data['server_public_key']}\`",
              "- Private key: generated and retained on the client; not uploaded."
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(summary) + "\n")
          PY

      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/vpn_key" "$RUNNER_TEMP/vpn_known_hosts"
