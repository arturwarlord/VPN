name: Build FreeRoute iOS app

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-client.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-client.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-unsigned:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go for WireGuardKit
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Install XcodeGen
        shell: bash
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Checkout WireGuardKit source and apply CI compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios/vendor
          git clone --depth 1 https://github.com/WireGuard/wireguard-apple.git ios/vendor/wireguard-apple
          python3 - <<'PY'
          from pathlib import Path

          root = Path("ios/vendor/wireguard-apple")
          manifest = root / "Package.swift"
          source = manifest.read_text(encoding="utf-8")
          first_line = source.splitlines()[0]
          if first_line == "// swift-tools-version:5.3":
              source = source.replace(first_line, "// swift-tools-version:5.5", 1)
              manifest.write_text(source, encoding="utf-8")
              print("Updated Swift tools manifest to 5.5 for SDK platform declarations.")
          elif first_line.startswith("// swift-tools-version:") and first_line >= "// swift-tools-version:5.5":
              print("WireGuardKit manifest already declares a compatible tools version.")
          else:
              raise SystemExit("Unexpected WireGuardKit Package.swift tools-version: " + first_line)

          header = root / "Sources/WireGuardKitC/WireGuardKitC.h"
          header_source = header.read_text(encoding="utf-8")
          if "#include <sys/types.h>" not in header_source:
              header_source = header_source.replace(
                  '#include "key.h"',
                  "#include <sys/types.h>\n#include \"key.h\"",
                  1,
              )
              header.write_text(header_source, encoding="utf-8")
              print("Added explicit system type include for modern Xcode module builds.")
          PY

      - name: Generate Xcode project
        shell: bash
        run: xcodegen generate --spec project.yml
        working-directory: ios

      - name: Resolve Swift package dependencies
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project ios/FreeRoute.xcodeproj \
            -scheme FreeRouteiOS \
            -derivedDataPath "$RUNNER_TEMP/FreeRouteDerivedData"

      - name: Build WireGuard Go bridge for iOS
        shell: bash
        run: |
          set -euo pipefail
          GO_BRIDGE="ios/vendor/wireguard-apple/Sources/WireGuardKitGo"
          PRODUCTS="$RUNNER_TEMP/FreeRouteDerivedData/Build/Products/Release-iphoneos"
          TEMP_BUILD="$RUNNER_TEMP/FreeRouteDerivedData/Build/Intermediates.noindex/WireGuardGoBridge"
          test -f "$GO_BRIDGE/Makefile"
          mkdir -p "$PRODUCTS" "$TEMP_BUILD"
          make -C "$GO_BRIDGE" build \
            PLATFORM_NAME=iphoneos \
            ARCHS=arm64 \
            SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
            CONFIGURATION_BUILD_DIR="$PRODUCTS" \
            CONFIGURATION_TEMP_DIR="$TEMP_BUILD" \
            CC="$(xcrun --sdk iphoneos --find clang)" \
            LIPO="$(xcrun --find lipo)"
          test -s "$PRODUCTS/libwg-go.a"

      - name: Compile unsigned iOS app and Packet Tunnel extension
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/FreeRoute.xcodeproj \
            -scheme FreeRouteiOS \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/FreeRouteDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify app and extension outputs
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/FreeRouteDerivedData/Build/Products/Release-iphoneos/FreeRoute.app"
          test -d "$APP"
          test -d "$APP/PlugIns/FreeRoutePacketTunnel.appex"
          test -f "$APP/THIRD_PARTY_NOTICES.txt"
          plutil -lint "$APP/Info.plist"
          plutil -lint "$APP/PlugIns/FreeRoutePacketTunnel.appex/Info.plist"

      - name: Package unsigned iOS build for inspection
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/FreeRouteDerivedData/Build/Products/Release-iphoneos/FreeRoute.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/freeroute-ios-unsigned.zip"

      - name: Upload unsigned iOS build
        uses: actions/upload-artifact@v4
        with:
          name: freeroute-ios-unsigned
          path: ${{ runner.temp }}/freeroute-ios-unsigned.zip
          if-no-files-found: error
          retention-days: 14
