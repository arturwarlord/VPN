name: Build FreeRoute Android APK

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/build-android-openvpn3.sh"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-client.yml"
  pull_request:
    paths:
      - "app/**"
      - "scripts/build-android-openvpn3.sh"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-client.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install SWIG Java binding generator
        run: |
          sudo apt-get update
          sudo apt-get install -y swig
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Set up vcpkg at the pinned 2026.10.16 release
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
        run: |
          git clone --depth 1 --branch 2026.10.16 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"
      - name: Verify SWIG Java wrapper generation prerequisites
        run: swig -version
      - name: Build OpenVPN 3 Core native library for ARM64
        run: bash scripts/build-android-openvpn3.sh
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify packaged OpenVPN 3 Core ABI and JNI export
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          LIBRARY="$(mktemp)"
          trap 'rm -f "$LIBRARY"' EXIT
          unzip -p "$APK" lib/arm64-v8a/libfreeroute_openvpn3.so > "$LIBRARY"
          test -s "$LIBRARY"
          readelf -h "$LIBRARY" | grep -q "AArch64"
          readelf -Ws "$LIBRARY" | grep -q "Java_com_arturwarlord_vpnclient_OpenVpn3Core_nativePlatform"
          echo "Verified ARM64 OpenVPN Core library and JNI entry point inside the APK."
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: freeroute-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
