name: Validate VPN project

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell scripts and GitHub Actions Bash steps
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/setup-wireguard.sh
          bash -n scripts/diagnose-wireguard-server.sh
          bash -n scripts/check-workflow-shell.sh
          bash -n tests/validate-endpoint.sh
          bash scripts/check-workflow-shell.sh
          bash tests/validate-endpoint.sh

      - name: Check required project files and build settings
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s scripts/setup-wireguard.sh
          grep -q 'Set WG_ENDPOINT' scripts/setup-wireguard.sh
          grep -q 'FreeRoute managed WireGuard configuration' scripts/setup-wireguard.sh
          grep -q 'attempting to restore the previous config' scripts/setup-wireguard.sh
          grep -q 'Refusing to drop or rewrite custom peers' scripts/setup-wireguard.sh
          grep -q 'existing_peer_count' scripts/setup-wireguard.sh
          grep -q 'iptables -A FORWARD -i wg0 -o' scripts/setup-wireguard.sh
          grep -q -- '--ctstate RELATED,ESTABLISHED' scripts/setup-wireguard.sh
          ! grep -q 'iptables -A FORWARD -i wg0 -j ACCEPT' scripts/setup-wireguard.sh
          test -s scripts/diagnose-wireguard-server.sh
          grep -q 'NAT rule is missing' scripts/diagnose-wireguard-server.sh
          grep -q 'forwarding rule is missing' scripts/diagnose-wireguard-server.sh
          test -s scripts/check-workflow-shell.sh
          test -s tests/validate-endpoint.sh
          test -s settings.gradle.kts
          test -s gradle.properties
          grep -q '^android.useAndroidX=true$' gradle.properties
          test -s app/build.gradle.kts
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/java/com/arturwarlord/vpnclient/MainActivity.kt
          test -s docs/ANDROID_CLIENT.md
          test -s windows/FreeRoute.Windows.csproj
          test -s windows/MainForm.cs
          test -s docs/WINDOWS_CLIENT.md
          test -s ios/project.yml
          test -s ios/App/ContentView.swift
          test -s ios/PacketTunnel/PacketTunnelProvider.swift
          test -s ios/Shared/TunnelConfiguration+WgQuickConfig.swift
          test -s ios/Shared/ProfileKeychain.swift
          test -s docs/IOS_CLIENT.md
          test -s docs/SERVER_DEPLOYMENT.md
          test -s docs/FREE_HOST_RESEARCH.md
          test -s docs/CLIENT_SMOKE_TEST.md
          test -s .github/workflows/diagnose-server.yml
          grep -q 'group.com.arturwarlord.freeroute' ios/App/FreeRoute.entitlements
          grep -q 'group.com.arturwarlord.freeroute' ios/PacketTunnel/FreeRoutePacketTunnel.entitlements
          grep -q 'ProfileKeychain.load' ios/PacketTunnel/PacketTunnelProvider.swift
          ! grep -q 'providerConfiguration = \["WgQuickConfig"' ios/App/ContentView.swift
          grep -q 'previousReference' ios/App/ContentView.swift
          grep -q 'diagnose-wireguard-server.sh' .github/workflows/diagnose-server.yml
          grep -q workflow_dispatch .github/workflows/deploy.yml
          grep -q 'WG_VALIDATE_ONLY=1' .github/workflows/deploy.yml
          grep -q 'ipwho.is' .github/workflows/deploy.yml
          grep -q 'country_code == "RU"' .github/workflows/deploy.yml
          grep -q 'VPN_KNOWN_HOSTS' .github/workflows/deploy.yml
          ! grep -q 'ssh-keyscan' .github/workflows/deploy.yml
          grep -q 'StrictHostKeyChecking=yes' .github/workflows/deploy.yml
          grep -q 'VPN_KNOWN_HOSTS' .github/workflows/diagnose-server.yml
          grep -q assembleDebug .github/workflows/android-client.yml
          grep -q 'WireGuardKitGo' .github/workflows/ios-client.yml
          grep -q 'CODE_SIGNING_ALLOWED=NO' .github/workflows/ios-client.yml

      - name: Check tracked files for private key material
        shell: bash
        run: |
          # Match a real key value on a config-like line, not code that validates
          # or documents the PrivateKey field name.
          if git grep -n -E 'BEGIN (OPENSSH|RSA|EC) PRIVATE KEY|^[[:space:]]*PrivateKey[[:space:]]*=[[:space:]]*[A-Za-z0-9+/]{40,}={0,2}$' -- ':!scripts/setup-wireguard.sh' ':!README.md' ':!windows/THIRD_PARTY_NOTICES.txt'; then
            echo "Potential private key material detected in tracked files." >&2
            exit 1
          fi
