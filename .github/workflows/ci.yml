name: Validate VPN project

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell scripts and GitHub Actions Bash steps
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/setup-wireguard.sh
          bash -n scripts/diagnose-wireguard-server.sh
          bash -n scripts/preflight-wireguard-host.sh
          bash -n scripts/check-workflow-shell.sh
          bash -n scripts/build-android-openvpn3.sh
          grep -q 'swig -c++ -java -package net.openvpn.ovpn3' scripts/build-android-openvpn3.sh
          grep -q 'ClientAPI_OpenVPNClientHelper.java' scripts/build-android-openvpn3.sh
          grep -q 'System.loadLibrary("freeroute_openvpn3")' app/src/main/java/com/arturwarlord/vpnclient/OpenVpn3SwigApi.kt
          bash -n tests/validate-endpoint.sh
          bash -n tests/validate-firewall-policy.sh
          bash -n tests/validate-deploy-safety.sh
          bash -n tests/validate-ipv6-fail-closed.sh
          bash -n tests/validate-download-site.sh
          bash scripts/check-workflow-shell.sh
          bash tests/validate-endpoint.sh
          bash tests/validate-firewall-policy.sh
          bash tests/validate-deploy-safety.sh
          bash tests/validate-ipv6-fail-closed.sh
          bash tests/validate-download-site.sh
          python3 -m unittest discover -s tests -p 'test_public_vpn_sources.py' -v

      - name: Check required project files and build settings
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s scripts/setup-wireguard.sh
          grep -q 'Set WG_ENDPOINT' scripts/setup-wireguard.sh
          grep -q 'FreeRoute managed WireGuard configuration' scripts/setup-wireguard.sh
          grep -q 'attempting to restore the previous config' scripts/setup-wireguard.sh
          grep -q 'Refusing to drop or rewrite custom peers' scripts/setup-wireguard.sh
          grep -q 'existing_peer_count' scripts/setup-wireguard.sh
          grep -q 'iptables -N FREEROUTE_FORWARD' scripts/setup-wireguard.sh
          grep -q -- '--ctstate RELATED,ESTABLISHED' scripts/setup-wireguard.sh
          grep -q 'iptables -I FORWARD 1 -j FREEROUTE_FORWARD' scripts/setup-wireguard.sh
          grep -q 'iptables -I INPUT 1 -i wg0 -j DROP' scripts/setup-wireguard.sh
          grep -q '192.168.0.0/16 -j DROP' scripts/setup-wireguard.sh
          grep -q '198.51.100.0/24 -j DROP' scripts/setup-wireguard.sh
          grep -q 'freeroute-managed' scripts/setup-wireguard.sh
          grep -q 'while iptables -C FORWARD -j FREEROUTE_FORWARD' scripts/setup-wireguard.sh
          test -s scripts/diagnose-wireguard-server.sh
          test -s scripts/preflight-wireguard-host.sh
          grep -q 'CAP_NET_ADMIN' scripts/preflight-wireguard-host.sh
          grep -q '/dev/net/tun' scripts/preflight-wireguard-host.sh
          grep -q 'Outbound IPv4 HTTPS connectivity verified' scripts/preflight-wireguard-host.sh
          grep -q 'never installs packages' scripts/preflight-wireguard-host.sh
          grep -q 'FREEROUTE_FORWARD' scripts/diagnose-wireguard-server.sh
          grep -q 'exact approved rule set' scripts/diagnose-wireguard-server.sh
          grep -q 'host-access block' scripts/diagnose-wireguard-server.sh
          test -s scripts/check-workflow-shell.sh
          test -s tests/validate-endpoint.sh
          test -s tests/validate-firewall-policy.sh
          test -s tests/validate-deploy-safety.sh
          test -s tests/validate-ipv6-fail-closed.sh
          test -s tests/validate-download-site.sh
          test -s index.html
          test -s .github/workflows/release.yml
          test -s .github/workflows/cleanup-draft-releases.yml
          grep -q 'workflow_call:' .github/workflows/android-client.yml
          grep -q 'workflow_call:' .github/workflows/windows-client.yml
          grep -q 'workflow_call:' .github/workflows/ios-client.yml
          grep -q 'gh release create' .github/workflows/release.yml
          grep -q 'cancel-in-progress: true' .github/workflows/release.yml
          grep -q 'maintenance/cleanup-release-drafts' .github/workflows/cleanup-draft-releases.yml
          test -s settings.gradle.kts
          test -s gradle.properties
          grep -q '^android.useAndroidX=true$' gradle.properties
          test -s app/build.gradle.kts
          test -s app/src/main/AndroidManifest.xml
          grep -q 'FOREGROUND_SERVICE_SYSTEM_EXEMPTED' app/src/main/AndroidManifest.xml
          grep -q 'android:foregroundServiceType="systemExempted"' app/src/main/AndroidManifest.xml
          grep -q 'ACTION_START_FOREGROUND' app/src/main/java/com/arturwarlord/vpnclient/OpenVpnVpnService.kt
          grep -q 'VpnService.prepare(this)' app/src/main/java/com/arturwarlord/vpnclient/OpenVpnVpnService.kt
          grep -q 'startForeground(' app/src/main/java/com/arturwarlord/vpnclient/OpenVpnVpnService.kt
          grep -q 'ACTION_STOP' app/src/main/java/com/arturwarlord/vpnclient/OpenVpnVpnService.kt
          grep -q 'Build.VERSION.SDK_INT >= 34' app/src/main/java/com/arturwarlord/vpnclient/OpenVpnVpnService.kt
          grep -q 'requestOpenVpnServiceSmokeTest' app/src/main/java/com/arturwarlord/vpnclient/MainActivity.kt
          grep -q 'pickOpenVpnProfileRequest' app/src/main/java/com/arturwarlord/vpnclient/MainActivity.kt
          grep -q 'OpenVpnProfileStore(this).import' app/src/main/java/com/arturwarlord/vpnclient/MainActivity.kt
          grep -q 'MAX_PROFILE_BYTES = 256 \* 1024' app/src/main/java/com/arturwarlord/vpnclient/OpenVpnProfileStore.kt
          grep -q 'CodingErrorAction.REPORT' app/src/main/java/com/arturwarlord/vpnclient/OpenVpnProfileStore.kt
          test -s docs/ANDROID_OPENVPN_PROFILE_IMPORT_PHASE7.md
          grep -q 'ACTION_EVALUATE_PROFILE' app/src/main/java/com/arturwarlord/vpnclient/OpenVpnVpnService.kt
          grep -q 'session.evaluateProfile(profile)' app/src/main/java/com/arturwarlord/vpnclient/OpenVpnVpnService.kt
          grep -q 'readText(file: File)' app/src/main/java/com/arturwarlord/vpnclient/OpenVpnProfileStore.kt
          grep -q 'requestOpenVpnProfileEvaluation(imported.absolutePath)' app/src/main/java/com/arturwarlord/vpnclient/MainActivity.kt
          test -s docs/ANDROID_OPENVPN_PROFILE_EVALUATION_PHASE8.md
          grep -q 'POST_NOTIFICATIONS' app/src/main/java/com/arturwarlord/vpnclient/MainActivity.kt
          grep -q 'startForegroundService(intent)' app/src/main/java/com/arturwarlord/vpnclient/MainActivity.kt
          grep -q 'onNativeEvent' app/src/main/java/com/arturwarlord/vpnclient/OpenVpnVpnService.kt
          grep -q 'nativeEventMethod_' app/src/main/cpp/openvpn_client_bridge.hpp
          grep -q 'GetMethodID(cls, "onNativeEvent"' app/src/main/cpp/openvpn_client_bridge.cpp
          grep -q 'e.fatal' app/src/main/cpp/openvpn_client_bridge.cpp
          grep -q 'CONNECTED' app/src/main/java/com/arturwarlord/vpnclient/OpenVpnVpnService.kt
          test -s app/src/main/java/com/arturwarlord/vpnclient/MainActivity.kt
          test -s app/src/main/java/com/arturwarlord/vpnclient/OpenVpn3Core.kt
          test -s app/src/main/java/com/arturwarlord/vpnclient/OpenVpn3SwigApi.kt
          test -s app/src/main/cpp/CMakeLists.txt
          test -s app/src/main/cpp/native_bridge.cpp
          test -s app/src/main/assets/OpenVPN3-MPL-2.0.txt
          test -s app/src/main/assets/ASIO-BOOST-1.0.txt
          test -s app/src/main/assets/FMT-MIT.txt
          test -s app/src/main/assets/LZ4-BSD-2-Clause.txt
          test -s app/src/main/assets/OpenSSL-Apache-2.0.txt
          test -s third_party/licenses/asio-boost-1.0.txt
          test -s third_party/licenses/fmt-mit.txt
          test -s third_party/licenses/lz4-bsd-2-clause.txt
          test -s third_party/licenses/openssl-apache-2.0.txt
          test -s third_party/licenses/OpenVPN3-MPL-2.0.txt
          test -s scripts/build-android-openvpn3.sh
          test -s docs/ANDROID_OPENVPN3_PHASE1.md
          grep -q '0abc8313b8fe5f63dbebc10d53094952957845d9' scripts/build-android-openvpn3.sh
          grep -q 'MPL 2.0' app/src/main/assets/THIRD_PARTY_NOTICES.txt
          grep -q 'arm64-v8a' app/build.gradle.kts
          grep -q 'nativePlatform' app/src/main/java/com/arturwarlord/vpnclient/OpenVpn3Core.kt

          grep -q 'https://ipwho.is/' app/src/main/java/com/arturwarlord/vpnclient/MainActivity.kt
          grep -q 'getStatistics(tunnel)' app/src/main/java/com/arturwarlord/vpnclient/MainActivity.kt
          grep -q 'latestHandshakeEpochMillis()' app/src/main/java/com/arturwarlord/vpnclient/MainActivity.kt
          grep -q 'hasHandshakeForCurrentSession' app/src/main/java/com/arturwarlord/vpnclient/MainActivity.kt
          grep -q 'checkCountryButton.isEnabled = isConnected && hasHandshakeForCurrentSession' app/src/main/java/com/arturwarlord/vpnclient/MainActivity.kt
          test -s docs/ANDROID_CLIENT.md
          test -s windows/FreeRoute.Windows.csproj
          test -s windows/MainForm.cs
          grep -q 'https://ipwho.is/' windows/MainForm.cs
          grep -q 'CheckExitCountryAsync' windows/MainForm.cs
          test -s docs/WINDOWS_CLIENT.md
          test -s ios/project.yml
          test -s ios/App/ContentView.swift
          grep -q 'https://ipwho.is/' ios/App/ContentView.swift
          grep -q 'checkExitCountry()' ios/App/ContentView.swift
          test -s ios/PacketTunnel/PacketTunnelProvider.swift
          test -s ios/Shared/TunnelConfiguration+WgQuickConfig.swift
          test -s ios/Shared/ProfileKeychain.swift
          test -s docs/IOS_CLIENT.md
          test -s docs/SERVER_DEPLOYMENT.md
          test -s docs/FREE_HOST_RESEARCH.md
          test -s docs/UZBEKISTAN_HOST_RESEARCH.md
          test -s docs/PUBLIC_UZBEK_PROXY_VPN_LISTS.md
          test -s docs/OPENVPN_TRANSPORT_RESEARCH.md
          test -s scripts/check_public_vpn_sources.py
          test -s tests/test_public_vpn_sources.py
          test -s .github/workflows/monitor-public-vpn-sources.yml
          grep -q 'schedule:' .github/workflows/monitor-public-vpn-sources.yml
          grep -q 'issues: write' .github/workflows/monitor-public-vpn-sources.yml
          test -s docs/UZBEKISTAN_PROVIDER_SUPPORT_QUESTIONS.md
          test -s docs/CLIENT_SMOKE_TEST.md
          test -s .github/workflows/diagnose-server.yml
          test -s .github/workflows/preflight-host.yml
          grep -q 'preflight-wireguard-host.sh' .github/workflows/preflight-host.yml
          grep -q 'inputs.ssh_port' .github/workflows/preflight-host.yml
          grep -q 'inputs.ssh_port' .github/workflows/deploy.yml
          grep -q 'inputs.ssh_port' .github/workflows/diagnose-server.yml
          grep -q 'ssh -p "$SSH_PORT"' .github/workflows/preflight-host.yml
          grep -q 'ssh -p "$SSH_PORT"' .github/workflows/deploy.yml
          grep -q 'ssh -p "$SSH_PORT"' .github/workflows/diagnose-server.yml
          grep -q 'VPN_USER" == "root"' .github/workflows/preflight-host.yml
          grep -q 'VPN_USER" == "root"' .github/workflows/deploy.yml
          grep -q 'VPN_USER" == "root"' .github/workflows/diagnose-server.yml
          grep -q 'group.com.arturwarlord.freeroute' ios/App/FreeRoute.entitlements
          grep -q 'group.com.arturwarlord.freeroute' ios/PacketTunnel/FreeRoutePacketTunnel.entitlements
          grep -q 'ProfileKeychain.load' ios/PacketTunnel/PacketTunnelProvider.swift
          ! grep -q 'providerConfiguration = \["WgQuickConfig"' ios/App/ContentView.swift
          grep -q 'previousReference' ios/App/ContentView.swift
          grep -q 'diagnose-wireguard-server.sh' .github/workflows/diagnose-server.yml
          grep -q workflow_dispatch .github/workflows/deploy.yml
          grep -q 'WG_VALIDATE_ONLY=1' .github/workflows/deploy.yml
          grep -q 'ipwho.is' .github/workflows/deploy.yml
          grep -q 'country_code == "RU"' .github/workflows/deploy.yml
          grep -q 'VPN_KNOWN_HOSTS' .github/workflows/deploy.yml
          ! grep -q 'ssh-keyscan' .github/workflows/deploy.yml
          grep -q 'StrictHostKeyChecking=yes' .github/workflows/deploy.yml
          grep -q 'VPN_KNOWN_HOSTS' .github/workflows/diagnose-server.yml
          grep -q assembleDebug .github/workflows/android-client.yml
          grep -q 'WireGuardKitGo' .github/workflows/ios-client.yml
          grep -q 'CODE_SIGNING_ALLOWED=NO' .github/workflows/ios-client.yml

      - name: Check tracked files for private key material
        shell: bash
        run: |
          # Match a real key value on a config-like line, not code that validates
          # or documents the PrivateKey field name.
          if git grep -n -E 'BEGIN (OPENSSH|RSA|EC) PRIVATE KEY|^[[:space:]]*PrivateKey[[:space:]]*=[[:space:]]*[A-Za-z0-9+/]{40,}={0,2}$' -- ':!scripts/setup-wireguard.sh' ':!README.md' ':!windows/THIRD_PARTY_NOTICES.txt'; then
            echo "Potential private key material detected in tracked files." >&2
            exit 1
          fi
