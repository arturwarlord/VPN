name: Validate VPN project

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell syntax
        run: bash -n scripts/setup-wireguard.sh

      - name: Check required project files and build settings
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s scripts/setup-wireguard.sh
          test -s settings.gradle.kts
          test -s gradle.properties
          grep -q '^android.useAndroidX=true$' gradle.properties
          test -s app/build.gradle.kts
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/java/com/arturwarlord/vpnclient/MainActivity.kt
          test -s docs/ANDROID_CLIENT.md
          grep -q workflow_dispatch .github/workflows/deploy.yml
          grep -q assembleDebug .github/workflows/android-client.yml

      - name: Check tracked files for private key material
        shell: bash
        run: |
          if git grep -n -E 'BEGIN (OPENSSH|RSA|EC) PRIVATE KEY|PrivateKey[[:space:]]*=' -- ':!scripts/setup-wireguard.sh' ':!README.md'; then
            echo "Potential private key material detected in tracked files." >&2
            exit 1
          fi
