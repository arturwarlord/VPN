name: Deploy WireGuard VPN

on:
  workflow_dispatch:
    inputs:
      endpoint_ip:
        description: Public IPv4 or IPv6 address of the VPS outside Russia
        required: true
        type: string
      port:
        description: WireGuard UDP port
        required: true
        default: "51820"
        type: string

permissions:
  contents: read

concurrency:
  group: vpn-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs and secrets
        env:
          VPN_HOST: ${{ secrets.VPN_HOST }}
          VPN_USER: ${{ secrets.VPN_USER }}
          VPN_SSH_KEY: ${{ secrets.VPN_SSH_KEY }}
          VPN_KNOWN_HOSTS: ${{ secrets.VPN_KNOWN_HOSTS }}
          ENDPOINT_IP: ${{ inputs.endpoint_ip }}
          WG_PORT: ${{ inputs.port }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPN_HOST" && -n "$VPN_USER" && -n "$VPN_SSH_KEY" && -n "$VPN_KNOWN_HOSTS" ]] || {
            echo "Add VPN_HOST, VPN_USER, VPN_SSH_KEY and VPN_KNOWN_HOSTS repository secrets." >&2
            exit 1
          }
          python3 - "$ENDPOINT_IP" "$WG_PORT" <<'PY'
          import ipaddress
          import sys

          try:
              endpoint = ipaddress.ip_address(sys.argv[1])
          except ValueError:
              raise SystemExit("endpoint_ip must be a valid IPv4 or IPv6 address.")

          blocked_ipv4_ranges = (
              "100.64.0.0/10",
              "192.0.0.0/24",
              "192.0.2.0/24",
              "192.88.99.0/24",
              "198.18.0.0/15",
              "198.51.100.0/24",
              "203.0.113.0/24",
          )
          is_blocked_v4_special = (
              isinstance(endpoint, ipaddress.IPv4Address)
              and any(endpoint in ipaddress.ip_network(network) for network in blocked_ipv4_ranges)
          )
          if (
              not endpoint.is_global
              or endpoint.is_private
              or endpoint.is_loopback
              or endpoint.is_link_local
              or endpoint.is_multicast
              or endpoint.is_reserved
              or endpoint.is_unspecified
              or is_blocked_v4_special
          ):
              raise SystemExit("endpoint_ip must be a globally routable public unicast IPv4 or IPv6 address.")
          if isinstance(endpoint, ipaddress.IPv6Address) and endpoint.ipv4_mapped is not None:
              raise SystemExit("Use the IPv4 address directly instead of an IPv4-mapped IPv6 address.")

          try:
              port = int(sys.argv[2], 10)
          except ValueError:
              raise SystemExit("port must be an integer from 1 to 65535.")

          if not 1 <= port <= 65535 or str(port) != sys.argv[2]:
              raise SystemExit("port must be a canonical integer from 1 to 65535.")
          PY

      - name: Verify endpoint country is not Russia
        env:
          ENDPOINT_IP: ${{ inputs.endpoint_ip }}
        shell: bash
        run: |
          set -euo pipefail
          # The endpoint is public already, but this sends it to a third-party
          # geolocation service. Fail closed if the service cannot confirm a country.
          curl --fail --silent --show-error --location --max-time 15 --retry 1 \
            "https://ipwho.is/$ENDPOINT_IP?fields=success,ip,country,country_code" \
            --output "$RUNNER_TEMP/endpoint-geo.json"
          python3 - "$RUNNER_TEMP/endpoint-geo.json" "$ENDPOINT_IP" <<'PY'
          import ipaddress
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              response = json.load(handle)

          if response.get("success") is not True:
              raise SystemExit("Geolocation service could not verify this endpoint; refusing deployment.")
          try:
              requested_ip = ipaddress.ip_address(sys.argv[2])
              response_ip = ipaddress.ip_address(str(response.get("ip", "")))
          except ValueError:
              raise SystemExit("Geolocation service returned an invalid IP; refusing deployment.")

          if response_ip != requested_ip:
              raise SystemExit("Geolocation response did not match the requested endpoint; refusing deployment.")

          country_code = str(response.get("country_code", "")).upper()
          country = str(response.get("country", ""))
          if len(country_code) != 2:
              raise SystemExit("Geolocation service returned no valid country; refusing deployment.")
          if country_code == "RU":
              raise SystemExit("The selected VPN endpoint geolocates to Russia; choose a different country.")
          print(f"Endpoint geolocation: {country} ({country_code}). This is an IP database estimate, not a guarantee of website geolocation.")
          PY

          # Run the exact same strict, non-mutating checks as the remote installer
          # so special-purpose ranges rejected by it cannot reach the deployment step.
          WG_VALIDATE_ONLY=1 WG_ENDPOINT="$ENDPOINT_IP" WG_PORT="$WG_PORT" bash scripts/setup-wireguard.sh
          printf '%s\n' "$VPN_SSH_KEY" > "$RUNNER_TEMP/vpn_key"
          chmod 600 "$RUNNER_TEMP/vpn_key"
          printf '%s\n' "$VPN_KNOWN_HOSTS" > "$RUNNER_TEMP/vpn_known_hosts"
          chmod 600 "$RUNNER_TEMP/vpn_known_hosts"
          grep -qve '^[[:space:]]*$' "$RUNNER_TEMP/vpn_known_hosts" || {
            echo "VPN_KNOWN_HOSTS must contain a verified known_hosts entry." >&2
            exit 1
          }

      - name: Verify SSH access and non-interactive sudo
        env:
          VPN_HOST: ${{ secrets.VPN_HOST }}
          VPN_USER: ${{ secrets.VPN_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/vpn_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/vpn_known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o UpdateHostKeys=no \
            "$VPN_USER@$VPN_HOST" "sudo -n true"

      - name: Install VPN server over SSH
        env:
          VPN_HOST: ${{ secrets.VPN_HOST }}
          VPN_USER: ${{ secrets.VPN_USER }}
          ENDPOINT_IP: ${{ inputs.endpoint_ip }}
          WG_PORT: ${{ inputs.port }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/vpn_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/vpn_known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o UpdateHostKeys=no \
            "$VPN_USER@$VPN_HOST" "sudo -n env WG_ENDPOINT='$ENDPOINT_IP' WG_PORT='$WG_PORT' bash -s" < scripts/setup-wireguard.sh

      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/vpn_key" "$RUNNER_TEMP/vpn_known_hosts"
