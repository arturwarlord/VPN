name: FreeRoute
options:
  bundleIdPrefix: com.arturwarlord.freeroute
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  WireGuardApple:
    path: vendor/wireguard-apple

targets:
  FreeRouteiOS:
    type: application
    platform: iOS
    sources:
      - App/FreeRouteIOSApp.swift
      - App/ContentView.swift
      - Shared/ProfileKeychain.swift
    resources:
      - Resources/THIRD_PARTY_NOTICES.txt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arturwarlord.freeroute
        PRODUCT_NAME: FreeRoute
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FreeRoute VPN
        CODE_SIGN_ENTITLEMENTS: App/FreeRoute.entitlements
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: FreeRoutePacketTunnel
        embed: true
      - sdk: NetworkExtension.framework

  FreeRoutePacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - PacketTunnel/PacketTunnelProvider.swift
      - Shared/TunnelConfiguration+WgQuickConfig.swift
      - Shared/String+ArrayConversion.swift
      - Shared/ProfileKeychain.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arturwarlord.freeroute.network-extension
        PRODUCT_NAME: FreeRoutePacketTunnel
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/FreeRoutePacketTunnel.entitlements
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - package: WireGuardApple
        product: WireGuardKit
      - sdk: NetworkExtension.framework

schemes:
  FreeRouteiOS:
    build:
      targets:
        FreeRouteiOS: all
        FreeRoutePacketTunnel: all
    run:
      config: Debug
    archive:
      config: Release
